[project]
name = "malaclyde-crawler"
version = "0.1.0"
description = "GitHub-aware web crawler with 5 operation modes, adaptive research, and LLM-friendly structured output"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Your Name" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "crawl4ai",
    "pydantic",
    "pypdf",
]

[project.optional-dependencies]
test = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0"]
research = ["sentence-transformers>=3.0.0"]

[project.urls]
Homepage = "https://github.com/anomalyco/malaclyde-crawler"
Repository = "https://github.com/anomalyco/malaclyde-crawler"

[build-system]
requires = ["setuptools", "wheel"]

[tool.setuptools.packages.find]
include = ["crawler*"]

[tool.pytest.ini_options]
markers = [
    "live: End-to-end tests against real GitHub URLs (requires network). Run with: pytest -m live --timeout=60",
]
testpaths = ["tests"]
